name: AMR Check

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint-parity:
    name: Fingerprint parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Verify cross-platform financial fingerprints
        run: >-
          uv run --frozen python -m pytest
          tests/test_amr_financial_fingerprint.py
          tests/test_amr_financial_p3_info_gain_inputs.py
          tests/test_amr_financial_p3_info_gain_m_member_baselines.py
          tests/test_amr_financial_p3_info_gain_f_member_baselines.py
          tests/test_amr_financial_p3_info_gain_r_member_baselines.py
          tests/test_amr_financial_p3_info_gain_coverage.py
          -q -p no:cacheprovider

  quality:
    name: Full Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Verify locked CI toolchain contract
        run: >-
          uv run --frozen python -m pytest
          tests/test_amr_ci_toolchain.py -q -p no:cacheprovider

      - name: Run full lint on changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files."
          else
            uv run --frozen ruff check "${files[@]}" --no-cache
          fi

      - name: Run repository tests
        run: uv run --frozen python -m pytest -q -p no:cacheprovider
